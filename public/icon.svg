<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>
  </defs>
  <!-- Rounded Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Outer Finder Pattern Top Left -->
  <rect x="96" y="96" width="128" height="128" rx="28" fill="#ffffff" />
  <rect x="120" y="120" width="80" height="80" rx="16" fill="#4f46e5" />
  <rect x="144" y="144" width="32" height="32" rx="8" fill="#ffffff" />

  <!-- Outer Finder Pattern Top Right -->
  <rect x="288" y="96" width="128" height="128" rx="28" fill="#ffffff" />
  <rect x="312" y="120" width="80" height="80" rx="16" fill="#4f46e5" />
  <rect x="336" y="144" width="32" height="32" rx="8" fill="#ffffff" />

  <!-- Outer Finder Pattern Bottom Left -->
  <rect x="96" y="288" width="128" height="128" rx="28" fill="#ffffff" />
  <rect x="120" y="312" width="80" height="80" rx="16" fill="#4f46e5" />
  <rect x="144" y="336" width="32" height="32" rx="8" fill="#ffffff" />

  <!-- Pixel Data Modules (Pixi aesthetic) -->
  <rect x="256" y="256" width="36" height="36" rx="10" fill="url(#accent)" />
  <rect x="320" y="256" width="36" height="36" rx="10" fill="#ffffff" />
  <rect x="380" y="256" width="36" height="36" rx="10" fill="url(#accent)" />

  <rect x="256" y="320" width="36" height="36" rx="10" fill="#ffffff" />
  <rect x="320" y="320" width="36" height="36" rx="10" fill="url(#accent)" />
  <rect x="380" y="320" width="36" height="36" rx="10" fill="#ffffff" />

  <rect x="256" y="380" width="36" height="36" rx="10" fill="url(#accent)" />
  <rect x="320" y="380" width="36" height="36" rx="10" fill="#ffffff" />
  <rect x="380" y="380" width="36" height="36" rx="10" fill="url(#accent)" />

  <!-- Center Sparkle / Pixi Dot -->
  <circle cx="256" cy="160" r="14" fill="#a5b4fc" />
  <circle cx="160" cy="256" r="14" fill="#a5b4fc" />
</svg>
